<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица Maintenance requests - Админ панель</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <button class="btn back-btn" onclick="goToAdminPanel()">&larr; Назад</button>
            <h1>Таблица Maintenance requests</h1>
        </div>
        
        <div class="admin-content">
            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>
                                <div class="filter-header">
                                    <span>ID</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="id">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Car ID</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="car_id">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Reported By</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="reported_by">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Created At</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="created_at">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Resolved At</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="resolved_at">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Status</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="status">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Description</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="description">
                                </div>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="maintenance-requests-table-body">
                        <!-- Содержимое таблицы будет загружено через JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    
    <script src="/static/admin_common.js"></script>
    <script src="/static/admin_maintenance_requests.js"></script>
</body>
</html>
