<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица Логи действий - Админ панель</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <button class="btn back-btn" onclick="goToAdminPanel()">&larr; Назад</button>
            <h1>Таблица логов действий</h1>
        </div>
        
        <div class="admin-content">
            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>
                                <div class="filter-header">
                                    <span>email пользователя</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="actor_user_id">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Тип действия</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="action_type">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>email целевого пользователя</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="target_user_id">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>VIN целевого автомобиля</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="target_car_vin">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Номер целевой аренды</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="target_rental_id">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Описание</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="description">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Старые значения</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="old_values">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Новые значения</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="new_values">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Создан</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="created_at">
                                </div>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="action-logs-table-body">
                        <!-- Содержимое таблицы будет загружено через JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    
    <script src="/static/admin_common.js"></script>
    <script src="/static/admin_action_logs_translations.js"></script>
    <script src="/static/admin_action_logs.js"></script>
</body>
</html>
