<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица Логи действий - Админ панель</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <button class="btn back-btn" onclick="goToAdminPanel()">&larr; Назад</button>
            <h1>Таблица логов действий</h1>
        </div>

        <div class="admin-content">
            <!-- Time range filters -->
            <div class="filter-section">
                <h3>Фильтры</h3>
                <div class="filter-row">
                    <div class="filter-group">
                        <label for="start-date">Дата начала:</label>
                        <input type="datetime-local" id="start-date" class="filter-date-input">
                    </div>
                    <div class="filter-group">
                        <label for="end-date">Дата окончания:</label>
                        <input type="datetime-local" id="end-date" class="filter-date-input">
                    </div>
                    <div class="filter-group">
                        <label for="action-type-filter">Тип действия:</label>
                        <select id="action-type-filter" class="filter-select">
                            <option value="">Все типы</option>
                            <option value="user_login">Вход пользователя</option>
                            <option value="user_logout">Выход пользователя</option>
                            <option value="user_registration">Регистрация</option>
                            <option value="profile_update">Обновление профиля</option>
                            <option value="car_create">Создание автомобиля</option>
                            <option value="car_update">Обновление автомобиля</option>
                            <option value="car_delete">Удаление автомобиля</option>
                            <option value="car_status_change">Изменение статуса автомобиля</option>
                            <option value="car_rental_start">Начало аренды</option>
                            <option value="car_rental_end">Завершение аренды</option>
                            <option value="car_rental_cancel">Отмена аренды</option>
                            <option value="car_rental_pending_completion">Ожидание завершения</option>
                            <option value="driver_license_upload">Загрузка прав</option>
                            <option value="driver_license_create">Создание прав</option>
                            <option value="driver_license_update">Обновление прав</option>
                            <option value="driver_license_delete">Удаление прав</option>
                            <option value="driver_license_approved">Одобрение прав</option>
                            <option value="driver_license_rejected">Отклонение прав</option>
                            <option value="trip_completion_create">Создание завершения поездки</option>
                            <option value="trip_completion_approved">Поездка одобрена</option>
                            <option value="trip_completion_rejected">Поездка отклонена</option>
                            <option value="trip_completion_update">Обновление завершения поездки</option>
                            <option value="user_ban">Блокировка пользователя</option>
                            <option value="user_unban">Разблокировка пользователя</option>
                            <option value="user_status_change">Изменение статуса пользователя</option>
                            <option value="payment_success">Успешный платеж</option>
                            <option value="payment_failed">Неудачный платеж</option>
                            <option value="maintenance_request">Запрос на обслуживание</option>
                            <option value="maintenance_request_create">Создание запроса на обслуживание</option>
                            <option value="maintenance_request_update">Обновление запроса</option>
                            <option value="maintenance_request_delete">Удаление запроса</option>
                            <option value="maintenance_resolve">Решение запроса</option>
                            <option value="car_photo_upload">Загрузка фото автомобиля</option>
                            <option value="car_photo_delete">Удаление фото автомобиля</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="user-email-filter">Email пользователя:</label>
                        <input type="email" id="user-email-filter" class="filter-email-input" placeholder="user@example.com">
                    </div>
                    <button class="btn apply-filters-btn" onclick="applyFilters()">Применить</button>
                    <button class="btn reset-filters-btn" onclick="resetFilters()">Сбросить</button>
                </div>
            </div>

            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>
                                <div class="filter-header">
                                    <span data-i18n="created_at">Время лога</span>
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span data-i18n="actor_email">Email пользователя</span>
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span data-i18n="action_type">Тип действия</span>
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span data-i18n="description">Описание</span>
                                </div>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="action-logs-table-body">
                        <!-- Содержимое таблицы будет загружено через JavaScript -->
                    </tbody>
                </table>
            </div>

            <!-- Модальное окно для деталей лога -->
            <div id="log-detail-modal" class="modal" style="display: none;">
                <div class="modal-content modal-content-large">
                    <div class="modal-header">
                        <h2 data-i18n="modal_title">Детали лога</h2>
                        <span class="close-btn" onclick="closeModal()">&times;</span>
                    </div>
                    <div class="modal-body" id="modal-body">
                        <!-- Детали лога будут загружены здесь -->
                    </div>
                    <div class="modal-footer">
                        <button class="btn" onclick="closeModal()">Закрыть</button>
                    </div>
                </div>
            </div>
        </div>

    <script src="/static/auth.js"></script>
    <script src="/static/admin_common.js"></script>
    <script src="/static/admin_action_logs_translations.js?v=3"></script>
    <script src="/static/admin_action_logs.js?v=2"></script>
</body>
</html>
