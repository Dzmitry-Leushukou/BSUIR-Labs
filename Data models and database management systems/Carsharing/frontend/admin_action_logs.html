<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица Action logs - Админ панель</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <button class="btn back-btn" onclick="goToAdminPanel()">&larr; Назад</button>
            <h1>Таблица Action logs</h1>
        </div>
        
        <div class="admin-content">
            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>
                                <div class="filter-header">
                                    <span>ID</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="id">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Actor User ID</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="actor_user_id">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Action Type</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="action_type">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Target User ID</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="target_user_id">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Target Car ID</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="target_car_id">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Target Rental ID</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="target_rental_id">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Description</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="description">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Old Values</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="old_values">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>New Values</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="new_values">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>User Agent</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="user_agent">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Created At</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="created_at">
                                </div>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="action-logs-table-body">
                        <!-- Содержимое таблицы будет загружено через JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    
    <script src="/static/admin_common.js"></script>
    <script src="/static/admin_action_logs.js"></script>
</body>
</html>
