<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица подтверждения завершения поездок - Админ панель</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <button class="btn back-btn" onclick="goToAdminPanel()">&larr; Назад</button>
            <h1>Таблица подтверждения завершения поездок</h1>
        </div>
        
        <div class="admin-content">
            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>
                                <div class="filter-header">
                                    <span>ID</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="id">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>User ID</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="user_id">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>ID автомобиля</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="car_id">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Начало</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="started_at">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Окончание</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="ended_at">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Price</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="price">
                                </div>
                            </th>
                            <th>Photos</th>
                            <th>
                                <div class="filter-header">
                                    <span>Статус</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="status">
                                </div>
                            </th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="trip-completions-table-body">
                        <!-- Содержимое таблицы будет загружено через JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    
    <script src="/static/admin_common.js"></script>
    <script src="/static/admin_trip_completions.js"></script>
</body>
</html>
