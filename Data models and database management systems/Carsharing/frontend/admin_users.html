<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица Users - Админ панель</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <button class="btn back-btn" onclick="goToAdminPanel()">&larr; Назад</button>
            <h1>Таблица Users</h1>
        </div>
        
        <div class="admin-content">
            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>
                                <div class="filter-header">
                                    <span>ID</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="id">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Email</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="email">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Name</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="name">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Surname</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="surname">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Cashback</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="cashback">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Role ID</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="role_id">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Status</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="status">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Created At</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="created_at">
                                </div>
                            </th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <!-- Содержимое таблицы будет загружено через JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    
    <script src="/static/admin_common.js"></script>
    <script src="/static/admin_users.js"></script>
</body>
</html>
