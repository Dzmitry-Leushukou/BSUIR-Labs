<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица Cars - Админ панель</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <button class="btn back-btn" onclick="goToAdminPanel()">&larr; Назад</button>
            <h1>Таблица Cars</h1>
        </div>
        
        <div class="admin-content">
            <div class="table-actions">
                <button class="btn primary-btn" onclick="openCreateCarModal()">Добавить автомобиль</button>
            </div>
            
            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>
                                <div class="filter-header">
                                    <span>ID</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="id">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>VIN</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="vin">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Plate Number</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="plate_number">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Model</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="model">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Status</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="status">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Updated At</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="updated_at">
                                </div>
                            </th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="cars-table-body">
                        <!-- Содержимое таблицы будет загружено через JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- Модальное окно для создания/редактирования автомобиля -->
        <div id="car-modal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeCarModal()">&times;</span>
                <h2 id="car-modal-title">Добавить автомобиль</h2>
                <form id="car-form">
                    <input type="hidden" id="car-id">
                    <div class="form-group">
                        <label for="vin">VIN:</label>
                        <input type="text" id="vin" required>
                    </div>
                    <div class="form-group">
                        <label for="plate_number">Plate Number:</label>
                        <input type="text" id="plate_number" required>
                    </div>
                    <div class="form-group">
                        <label for="model">Model:</label>
                        <input type="text" id="model" required>
                    </div>
                    <div class="form-group">
                        <label for="status">Status:</label>
                        <select id="status" required>
                            <option value="available">Available</option>
                            <option value="rented">Rented</option>
                            <option value="maintenance">Maintenance</option>
                            <option value="out_of_service">Out of Service</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="main_photo_id">Main Photo ID:</label>
                        <input type="number" id="main_photo_id">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn primary-btn">Сохранить</button>
                        <button type="button" class="btn secondary-btn" onclick="closeCarModal()">Отмена</button>
                    </div>
                </form>
            </div>
        </div>
    
    <script src="/static/admin_common.js"></script>
    <script src="/static/admin_cars.js"></script>
</body>
</html>
