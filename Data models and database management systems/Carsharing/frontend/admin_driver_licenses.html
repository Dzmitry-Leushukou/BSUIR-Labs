<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица подтверждения документов - Админ панель</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <button class="btn back-btn" onclick="goToAdminPanel()">&larr; Назад</button>
            <h1>Таблица подтверждения документов</h1>
        </div>
        
        <div class="admin-content">
            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Driver ID</th>
                            <th>License Number</th>
                            <th>Issued By</th>
                            <th>Expiration Date</th>
                            <th>Document Photo ID</th>
                            <th>Photo</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="driver-licenses-table-body">
                        <!-- Содержимое таблицы будет загружено через JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    
    <script src="/static/admin_common.js"></script>
    <script src="/static/admin_driver_licenses.js"></script>
</body>
</html>
