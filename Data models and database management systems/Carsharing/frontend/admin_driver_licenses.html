<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица подтверждения документов - Админ панель</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <button class="btn back-btn" onclick="goToAdminPanel()">&larr; Назад</button>
            <h1>Таблица подтверждения документов</h1>
        </div>
        
        <div class="admin-content">
            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>
                                <div class="filter-header">
                                    <span>ID</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="id">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Driver ID</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="driver_id">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>License Number</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="license_number">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Issued By</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="issued_by">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Expiration Date</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="expiration_date">
                                </div>
                            </th>
                            <th>
                                <div class="filter-header">
                                    <span>Document Photo ID</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="document_photo_id">
                                </div>
                            </th>
                            <th>Photo</th>
                            <th>
                                <div class="filter-header">
                                    <span>Status</span>
                                    <input type="text" class="filter-input" placeholder="Фильтр..." data-column="status">
                                </div>
                            </th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="driver-licenses-table-body">
                        <!-- Содержимое таблицы будет загружено через JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    
    <script src="/static/admin_common.js"></script>
    <script src="/static/admin_driver_licenses.js"></script>
</body>
</html>
