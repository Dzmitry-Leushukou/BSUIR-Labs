services:
  postgres:
    image: postgis/postgis:17-3.4
    container_name: carsharing_postgres
    environment:
      POSTGRES_DB: carsharing_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carsharing_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: carsharing_mongodb
    environment:
      MONGO_INITDB_DATABASE: carsharing_logs
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: carsharing_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: carsharing_app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_NAME=carsharing_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_PORT=5432
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_DB=carsharing_logs
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=your-secret-key-change-in-production
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - ACTION_LOGS_TTL_DAYS=90
      - DB_QUERY_LOGS_TTL_DAYS=30
      - ERROR_LOGS_TTL_DAYS=60
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      sh -c "python populate_db.py && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"


volumes:
  postgres_data:
  mongodb_data:
  redis_data: