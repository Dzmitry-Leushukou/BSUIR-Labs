services:
  postgres:
    image: postgis/postgis:17-3.4
    container_name: carsharing_postgres
    environment:
      POSTGRES_DB: carsharing_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carsharing_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: carsharing_app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_NAME=carsharing_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  nginx:
    image: nginx:alpine
    container_name: carsharing_nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web
    restart: always

volumes:
  postgres_data: